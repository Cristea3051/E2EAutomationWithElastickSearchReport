# Browser Configuration
browser=firefox
headless=true
slowmo=0
timeout=30000
viewport.width=1920
viewport.height=1080

# Environment Configuration
base.url=https://example.com
env=qa

# Elasticsearch Configuration
# To start Elasticsearch with Docker, run: ./start-elasticsearch.sh (or .bat on Windows)
# See ELASTICSEARCH_SETUP.md for detailed setup instructions
elasticsearch.url=http://localhost:9200
elasticsearch.index=test-results
elasticsearch.enabled=true
# Leave username/password empty for unsecured setup
# For secured setup (docker-compose-secure.yml), use: elastic / changeme
elasticsearch.username=
elasticsearch.password=

# Test Execution Configuration
parallel.execution=true
thread.count=4
screenshot.on.failure=true
video.on.failure=true

# Logging Configuration
log.level=INFO
